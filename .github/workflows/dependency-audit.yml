name: Dependency Audit

on:
  schedule:
    - cron: "23 7 * * *"
  workflow_dispatch:
    inputs:
      crabbox_runner_label:
        description: Ephemeral Crabbox runner pool label; empty uses existing runners
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: dependency-audit-${{ github.ref }}
  cancel-in-progress: false

jobs:
  audit:
    if: github.event_name != 'schedule' || github.repository == 'openclaw/openclaw'
    runs-on: ${{ github.event_name == 'workflow_dispatch' && inputs.crabbox_runner_label != '' && fromJSON(format('["self-hosted","crabbox",{0},{1}]', toJSON(inputs.crabbox_runner_label), toJSON('ubuntu-24.04'))) || ('ubuntu-24.04') }}
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        run: |
          source .github/actions/setup-pnpm-store-cache/ensure-node.sh
          openclaw_ensure_node "24.x"

      - name: Audit production dependencies
        run: |
          echo 'Triage owner: @steipete. Investigate failures and rerun this strict audit to confirm recovery.' >> "$GITHUB_STEP_SUMMARY"
          node scripts/pre-commit/pnpm-audit-prod.mjs --audit-level=high
